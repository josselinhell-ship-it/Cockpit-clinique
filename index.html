<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#15324a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Cockpit Clinique" />
  <style>
:root {
  --navy: #15324a;
  --navy-2: #214d6d;
  --ink: #1d2830;
  --muted: #566875;
  --bg: #f1f5f8;
  --card: #ffffff;
  --border: #d9e1e6;
  --soft: #edf3f6;
  --a: #a63e43;
  --b: #805619;
  --c: #286b49;
  --d: #536371;
  --shadow: 0 8px 24px rgba(27, 52, 71, .08);
  --radius: 18px;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--bg);
  padding-bottom: calc(82px + env(safe-area-inset-bottom));
}
button, input, select, textarea { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }
.hidden { display: none !important; }
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: calc(14px + env(safe-area-inset-top)) 18px 14px;
  background: rgba(21, 50, 74, .96);
  color: white;
  backdrop-filter: blur(14px);
}
.topbar h1 { margin: 1px 0 0; font-size: clamp(20px, 4vw, 27px); line-height: 1.1; }
.eyebrow { font-size: 12px; opacity: .72; text-transform: uppercase; letter-spacing: .08em; }
.top-actions { display: flex; gap: 8px; }
.icon-btn {
  width: 44px; height: 44px; border: 0; border-radius: 14px;
  background: rgba(255,255,255,.12); color: white; font-size: 24px;
}
.app-shell { max-width: 1100px; margin: 0 auto; padding: 16px; }
.bottom-nav {
  position: fixed; z-index: 30; left: 0; right: 0; bottom: 0;
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 8px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
  background: rgba(255,255,255,.96); border-top: 1px solid var(--border);
  backdrop-filter: blur(14px);
}
.nav-btn { min-height: 48px; border: 0; border-radius: 14px; background: transparent; color: var(--muted); font-weight: 700; }
.nav-btn.active, #newPatientBtn { background: var(--navy); color: white; }
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 16px;
}
.stack { display: grid; gap: 14px; }
.grid-2 { display: grid; gap: 14px; }
@media (min-width: 760px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
.section-head { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin: 4px 0 10px; }
.section-head h2 { margin: 0; font-size: 18px; }
.section-head p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.input, .select, .textarea {
  width: 100%; min-height: 46px; border: 1px solid var(--border); border-radius: 13px;
  background: white; color: var(--ink); padding: 11px 12px; font-size: 16px;
}
.textarea { min-height: 88px; resize: vertical; }
.label { display: grid; gap: 6px; font-size: 13px; font-weight: 700; color: #33424c; }
.form-grid { display:grid; gap:12px; }
@media (min-width:700px) { .form-grid.two { grid-template-columns:1fr 1fr; } }
.btn {
  min-height: 46px; border-radius: 13px; border: 1px solid var(--border); padding: 10px 14px;
  font-weight: 800; background: white; color: var(--ink);
}
.btn.primary { border-color: var(--navy); background: var(--navy); color: white; }
.btn.secondary { color: var(--navy); border-color: #9eb2c1; background: #f7fbfd; }
.btn.danger { color: #9e3d3d; border-color: #e2b9b9; background: #fff7f7; }
.btn-row { display:flex; flex-wrap:wrap; gap:10px; }
.patient-card { display:grid; gap:10px; cursor:pointer; }
.patient-top { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
.patient-card h3 { margin:0; font-size:18px; }
.meta { color:var(--muted); font-size:13px; }
.badges { display:flex; flex-wrap:wrap; gap:7px; }
.badge { display:inline-flex; align-items:center; min-height:28px; padding:4px 9px; border-radius:999px; background:var(--soft); font-size:12px; font-weight:700; }
.badge.a { background:#f9e7e7; color:#8f4040; }
.badge.b { background:#fbf0dd; color:#8d6428; }
.badge.c { background:#e6f3eb; color:#2f6f4e; }
.badge.d { background:#edf0f2; color:#5c6670; }
.empty { text-align:center; color:var(--muted); padding:34px 18px; border:1px dashed #bdc9d0; border-radius:var(--radius); background:rgba(255,255,255,.5); }
.hero { display:grid; gap:10px; background:linear-gradient(135deg, #15324a, #214d6d); color:white; border-radius:22px; padding:18px; box-shadow:var(--shadow); }
.hero h2 { margin:0; font-size:24px; }
.hero .meta { color:rgba(255,255,255,.75); }
.hero-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
.hero-actions .btn { background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.22); color:white; }
.tabs { display:flex; gap:8px; overflow:auto; padding-bottom:2px; }
.tab { white-space:nowrap; min-height:42px; border:1px solid var(--border); border-radius:12px; background:white; padding:8px 12px; font-weight:800; color:var(--muted); }
.tab.active { background:var(--navy); color:white; border-color:var(--navy); }
.quality-card { display:grid; gap:12px; }
.quality-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
.quality-card h3 { margin:0; font-size:16px; }
.status-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.status-btn { min-height:44px; border:1px solid var(--border); border-radius:12px; background:white; font-weight:900; }
.status-btn.active[data-status="A"] { background:var(--a); color:white; border-color:var(--a); }
.status-btn.active[data-status="B"] { background:var(--b); color:white; border-color:var(--b); }
.status-btn.active[data-status="C"] { background:var(--c); color:white; border-color:var(--c); }
.status-btn.active[data-status="D"] { background:var(--d); color:white; border-color:var(--d); }
.quality-foot { display:grid; gap:5px; color:var(--muted); font-size:12px; }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip { min-height:38px; border:1px solid var(--border); border-radius:999px; padding:7px 11px; background:white; font-size:13px; font-weight:700; color:#4b5962; }
.chip.selected { background:#dfeaf0; border-color:#8eabbc; color:var(--navy); }
.timeline { display:grid; gap:10px; }
.timeline-item { border-left:4px solid #b7c7d1; padding:10px 12px; background:#fbfcfd; border-radius:0 12px 12px 0; }
.timeline-item strong { display:block; margin-bottom:4px; }
.timeline-item .small { color:var(--muted); font-size:12px; }
.table-wrap { overflow-x:auto; border-radius:14px; border:1px solid var(--border); }
table { width:100%; border-collapse:collapse; min-width:690px; background:white; }
th,td { text-align:left; vertical-align:top; padding:11px 10px; border-bottom:1px solid #e8edf0; font-size:13px; }
th { background:#eef3f6; color:#40515d; position:sticky; top:0; }
tr:last-child td { border-bottom:0; }
.modal { width:min(720px, calc(100% - 24px)); border:0; border-radius:22px; padding:0; box-shadow:0 30px 80px rgba(0,0,0,.25); }
.modal::backdrop { background:rgba(18,31,40,.42); backdrop-filter:blur(3px); }
.modal-inner { padding:18px; display:grid; gap:14px; }
.modal-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
.modal-head h2 { margin:0; }
.close-btn { width:44px; height:44px; border:0; border-radius:12px; background:var(--soft); font-size:22px; }
.toast { position:fixed; z-index:50; left:50%; bottom:calc(92px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px); opacity:0; pointer-events:none; background:#152733; color:white; border-radius:999px; padding:10px 14px; font-size:13px; font-weight:700; transition:.2s ease; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.kpi-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.kpi { background:#f6f9fb; border:1px solid var(--border); border-radius:14px; padding:11px; }
.kpi strong { font-size:20px; display:block; }
.kpi span { color:var(--muted); font-size:11px; }
.notice { border:1px solid #d6e1e8; border-radius:14px; padding:12px; background:#f7fafc; color:#475862; font-size:13px; }
.search { margin-bottom:14px; }
.small { font-size:12px; color:var(--muted); }
@media (max-width: 520px) {
  .app-shell { padding: 12px; }
  .card { padding: 14px; }
  .kpi-row { grid-template-columns:1fr 1fr 1fr; }
  .quality-head { display:grid; }
}

/* iPad : rythme, contrastes et surfaces tactiles */
body { line-height: 1.5; padding-bottom: calc(110px + env(safe-area-inset-bottom)); }
button, .patient-card { touch-action: manipulation; }
button { cursor: pointer; }
:where(button, input, select, textarea, [tabindex]):focus-visible {
  outline: 3px solid #387da9; outline-offset: 4px;
}
.topbar {
  min-height: 100px;
  padding: calc(20px + env(safe-area-inset-top)) max(24px, calc((100vw - 1044px) / 2)) 20px;
  background: #15324a; border-bottom: 1px solid #345269;
  box-shadow: 0 4px 18px rgba(21,50,74,.1);
}
.topbar > div:first-child { min-width: 0; }
.topbar h1 { margin-top: 5px; font-size: clamp(23px, 3vw, 30px); line-height: 1.25; overflow-wrap: anywhere; letter-spacing: -.025em; }
.topbar .eyebrow { color: #bfced9; opacity: 1; font-size: 11px; font-weight: 700; letter-spacing: .14em; }
.top-actions { flex-shrink: 0; gap: 10px; }
.icon-btn { width: 48px; height: 48px; border: 1px solid #567084; background: #29465e; }
.app-shell { padding: 28px; }
.stack, .grid-2 { gap: 20px; }
.section-head { margin: 8px 0 18px; align-items: center; }
.section-head h2 { font-size: 20px; letter-spacing: -.02em; }
.section-head p { margin-top: 5px; font-size: 14px; }
.search { margin-bottom: 24px; }
.input, .select, .textarea { min-height: 52px; padding: 13px 15px; border-color: #b8c8d3; }
.search .input { box-shadow: 0 2px 6px rgba(21,50,74,.03); }
.card { padding: 22px; box-shadow: 0 3px 12px rgba(21,50,74,.04); }
.patient-card { gap: 16px; border-left: 4px solid var(--navy-2); }
.patient-card h3 { font-size: 21px; letter-spacing: -.02em; line-height: 1.35; overflow-wrap: anywhere; }
.patient-top > div { min-width: 0; }
.patient-top > .badge { flex-shrink: 0; }
.patient-top .meta { margin-top: 5px; }
.patient-card > .meta { font-size: 15px; color: #344f62; overflow-wrap: anywhere; }
.meta { font-size: 14px; }
.badges { gap: 9px; }
.badge { min-height: 34px; padding: 5px 12px; font-size: 13px; border: 1px solid transparent; }
.badge.a { border-color: #e3b4b7; color: #8a3037; background: #fbecee; }
.badge.b { border-color: #dcc59e; color: #714a14; background: #fcf3e3; }
.badge.c { border-color: #a9cfb7; color: #245f40; background: #eaf5ee; }
.badge.d { border-color: #c5cfd7; color: #465966; background: #eef2f5; }
.patient-card .badges { padding-top: 14px; border-top: 1px solid #e5ecf1; }
.patient-card .badges .badge { min-width: 60px; justify-content: center; font-variant-numeric: tabular-nums; }
.bottom-nav {
  left: 20px; right: 20px; bottom: calc(12px + env(safe-area-inset-bottom));
  max-width: 700px; margin-inline: auto; padding: 8px; gap: 8px;
  border: 1px solid #cbd7df; border-radius: 22px;
  background: #fff; box-shadow: 0 8px 30px rgba(21,50,74,.14);
}
.nav-btn { min-height: 56px; font-size: 15px; color: #435e72; }
.nav-btn.active { background: #e7eff5; color: var(--navy); box-shadow: inset 0 0 0 1px #bbcdda; }
#newPatientBtn { background: var(--navy); color: white; }
.hero { padding: 26px; gap: 16px; background: #15324a; }
.hero h2 { font-size: 28px; letter-spacing: -.025em; overflow-wrap: anywhere; }
.hero .meta { color: #c4d4df; }
.hero-actions { gap: 12px; }
.hero-actions .case-archive { background: transparent; font-weight: 500; }
.btn { min-height: 50px; padding: 12px 18px; font-weight: 700; }
.tabs { gap: 10px; padding: 5px 4px 8px; }
.tab { min-height: 48px; padding: 10px 18px; font-weight: 700; }
.quality-card { gap: 18px; }
.quality-card h3 { font-size: 18px; }
.quality-head > div { min-width: 0; }
.quality-head .badge { max-width: 48%; border-radius: 12px; }
.quality-foot { gap: 8px; font-size: 14px; padding-top: 14px; border-top: 1px solid #e5ecf1; }
.status-grid { gap: 12px; }
.status-btn { min-height: 54px; font-size: 19px; color: #43596b; background: #f7f9fb; }
.status-btn.active { border-width: 2px; outline: 2px solid var(--navy); outline-offset: 2px; }
.chip { min-height: 46px; padding: 10px 14px; font-size: 14px; }
.chip.selected { border-color: #63859c; box-shadow: inset 0 0 0 1px #63859c; }
.kpi { padding: 17px; background: white; }
.kpi strong { font-size: 28px; color: var(--navy); line-height: 1.3; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 13px; }
.small, .timeline-item .small { font-size: 14px; }
.notice { padding: 16px; font-size: 14px; }
.empty { padding: 40px 20px; font-size: 15px; }
th, td { padding: 15px 14px; font-size: 14px; }
.timeline-item { padding: 16px; }
.modal { max-height: calc(100dvh - 32px); color: var(--ink); }
.modal-inner { padding: 28px; gap: 20px; }
.modal-head h2 { font-size: 24px; line-height: 1.3; }
.label { font-size: 14px; gap: 8px; }
.form-grid { gap: 16px; }
.close-btn { flex-shrink: 0; width: 48px; height: 48px; }
.toast { bottom: calc(104px + env(safe-area-inset-bottom)); max-width: calc(100% - 32px); width: max-content; text-align: center; transition: none; }
@media (hover: hover) {
  .patient-card:hover { border-color: #8da9bc; background: #fbfdff; }

}

}
.quality-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px; }
.quality-summary .small { margin-top: 5px; }
  </style>
  <title>Cockpit Clinique</title>
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">Cockpit clinique</div>
      <h1 id="pageTitle">Patients actifs</h1>
    </div>
    <div class="top-actions">
      <button id="backBtn" class="icon-btn hidden" type="button" aria-label="Retour">←</button>
      <button id="settingsBtn" class="icon-btn" type="button" aria-label="Sauvegarde et réglages">⋯</button>
    </div>
  </header>

  <main id="app" class="app-shell" aria-live="polite"></main>

  <nav class="bottom-nav" aria-label="Navigation principale">
    <button class="nav-btn active" data-route="patients" type="button">Actifs</button>
    <button class="nav-btn" data-route="archives" type="button">Tous / Archives</button>
    <button class="nav-btn" id="newPatientBtn" type="button">+ Patient</button>
  </nav>

  <dialog id="modal" class="modal">
    <div id="modalContent"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
(() => {
  'use strict';

  const STORAGE_KEY = 'cockpit_clinique_v1_data';
  const CURRENT_VERSION = 4;

  const QUALITIES = [
    {
      id: 'mobility', name: 'Mobilité / ROM exploitable',
      pivot: 'WBLT / ROM ciblée', exit: 'Changement > MDC + ROM suffisante pour la tâche',
      tests: ['WBLT', 'ROM ciblée', 'Autre']
    },
    {
      id: 'strength', name: 'Force cheville-pied',
      pivot: 'Dynamométrie VALD', exit: 'LSI ~90–95 % si pertinent + valeur absolue/relative satisfaisante',
      tests: ['Dynamométrie VALD', 'LSI', 'Force relative', 'Autre']
    },
    {
      id: 'capacity', name: 'Endurance de force',
      pivot: 'Single-leg heel-rise / HRET', exit: 'Valeur absolue + symétrie + tâche réelle tolérée',
      tests: ['Single-leg heel-rise', 'HRET', 'Autre']
    },
    {
      id: 'sensorimotor', name: 'Contrôle sensorimoteur',
      pivot: 'Foot Lift / Y-Balance Test', exit: 'Test satisfaisant ; plus de travail spécifique nécessaire',
      tests: ['Foot Lift', 'Y-Balance Test', 'Autre']
    },
    {
      id: 'ssc', name: 'SSC / capacité réactive',
      pivot: 'ForceDecks / hops / RSI', exit: 'Qualité mécanique + répétabilité + tolérance + transfert',
      tests: ['RSI', 'Hop test', 'ForceDecks', 'Autre']
    },
    {
      id: 'function', name: 'Fonction / exposition',
      pivot: 'PSFS / Ankle-GO / tâche réelle', exit: 'Exposition cible tolérée + critères globaux suffisants',
      tests: ['PSFS', 'Ankle-GO', 'Exposition réelle', 'Autre']
    }
  ];

  const LESIONS = ['Latérale', 'Médiale', 'Syndesmose', 'Médio-pied / Chopart', 'Postérieure', 'ICC / récidivante', 'Mixte / autre'];
  const LESION_MEMO = {
    'Latérale': 'DF + fibulaires/éversion + YBT.',
    'Médiale': 'DF + inverseurs/tibial postérieur + YBT.',
    'Syndesmose': 'Protéger les contraintes ouvrant la mortaise ; restaurer la DF progressivement selon stabilité/tolérance.',
    'Médio-pied / Chopart': 'Douleur / tolérance à la charge + mobilité médio/avant-pied + vigilance lésions associées.',
    'Postérieure': 'Douleur en flexion plantaire/compression + FHL / composante osseuse selon présentation.',
    'ICC / récidivante': 'Profil Hertel ; priorités très individualisées.',
    'Mixte / autre': 'Adapter les priorités au profil lésionnel et à la tâche cible.'
  };

  const SESSION_OPTIONS = {
    symptoms: ['Raideur', 'Œdème', 'Instabilité', 'Giving-way', 'Appréhension', 'Autre'],
    exposure: ['AVQ', 'Travail', 'Marche', 'Escaliers', 'Course', 'Sauts', 'COD / pivots', 'Entraînement partiel', 'Entraînement complet', 'Compétition'],
    tolerance: ['Bonne', 'Acceptable', 'Réaction <24 h', 'Réaction >24 h', 'Douleur réactive', 'Œdème réactif', 'Fatigue excessive'],
    adherence: ['Complète', 'Partielle', 'Faible', 'Non faite', 'Consignes respectées', 'Consignes partiellement respectées', 'Auto-charge excessive']
  };

  // Naming convention for all templates: Endurance de force (stable quality id: capacity).
  const field = (id, label, type='number') => ({id,label,type});
  const referenceFields = [field('reference','Norme / percentile / référence externe','text')];
  const bilateralFields = unit => [field('affected',`Côté atteint (${unit})`),field('contralateral',`Côté controlatéral (${unit})`),...referenceFields];
  const component = (id,name,fields) => ({id,name,fields});
  const metric = (id,name) => component(id,name,[field('value','Valeur'),field('unit','Unité','text'),field('asymmetry','Asymétrie éventuelle (%)'),...referenceFields]);
  const KNEE_QUALITIES = [
    {id:'mobility',name:'Mobilité / ROM exploitable',pivot:'Extension / flexion du genou',
      tests:['Extension / flexion du genou'],exit:'ROM suffisant pour les besoins fonctionnels du patient',
      question:'Le déficit de ROM limite-t-il encore la progression fonctionnelle ?',
      guidance:'A : déficit de ROM limitant la progression, la fonction ou l’exposition. B : déficit mesurable secondaire / non limitant. C : ROM suffisant pour les besoins fonctionnels. D : non testé / non pertinent / non interprétable.',
      fields:[field('extension','Extension côté atteint (°)'),field('flexion','Flexion côté atteint (°)'),field('referenceExtension','Extension controlatérale (°)'),field('referenceFlexion','Flexion controlatérale (°)')]},
    {id:'strength',name:'Force du membre inférieur',pivot:'Forces bilatérales / LSI',
      tests:['Quadriceps','Ischio-jambiers','Mollet','Fessiers latéraux / abducteurs'],exit:'Interprétation clinique selon les besoins fonctionnels et les références disponibles',aggregate:true,bilateral:true,
      components:[{...component('quadriceps','Quadriceps',bilateralFields('N')),shortName:'Quadri'},{...component('hamstrings','Ischio-jambiers',bilateralFields('N')),shortName:'IJ'},component('calf','Mollet',bilateralFields('N')),{...component('abductors','Fessiers latéraux / abducteurs',bilateralFields('N')),shortName:'Abducteurs'}]},

        'Médiale':{watch:'DF · inverseurs / tibial postérieur · YBT',qualities:['mobility','strength','sensorimotor','function'],tests:{mobility:['WBLT'],strength:['Dynamométrie VALD'],sensorimotor:['Y-Balance Test'],capacity:[],ssc:[]}},
        'Syndesmose':{watch:'stabilité · tolérance · DF progressive',qualities:['mobility','function'],tests:{mobility:['ROM ciblée'],strength:[],capacity:[],sensorimotor:[],ssc:[]}},
        'Médio-pied / Chopart':{watch:'charge · mobilité médio / avant-pied · lésions associées',qualities:['mobility','function'],tests:{mobility:['ROM ciblée'],strength:[],capacity:[],sensorimotor:[],ssc:[]}},
        'Postérieure':{watch:'flexion plantaire / compression · FHL · os',qualities:['mobility','strength','function'],tests:{mobility:['ROM ciblée'],capacity:[],sensorimotor:[],ssc:[]}},

        'Mixte / autre':{watch:'profil lésionnel · tâche cible'}},

      subtypes:['SFP','ITBS / TFL','Ménisque','Traumatique simple','Post-op hors LCA','Autre'],
      memos:{
        'SFP':'Irritabilité / douleur fémoro-patellaire · tolérance à la flexion chargée · force quadriceps + abducteurs · contrôle en tâche unipodale · exposition escaliers / squat / course · réaction symptomatique à 24 h.',
        'ITBS / TFL':'Exposition course prioritaire · volume / fréquence / changement récent de charge · force abducteurs · tolérance à la répétition · déclencheurs spécifiques · retour progressif au volume cible.',
        'Ménisque':'Épanchement / irritabilité · extension + flexion · tolérance à la charge et à la flexion · force quadriceps · contrôle unipodal · exposition progressive aux rotations / pivots.',
        'Traumatique simple':'Douleur / gonflement · ROM · force · contrôle · reprise de charge · retour à la fonction.',
        'Post-op hors LCA':'Restrictions chirurgicales · ROM autorisé · mise en charge autorisée · délais spécifiques éventuels · surveillance douleur / effusion · progression critériée dès que possible.',
        'Autre':'Précautions spécifiques · objectif · notes libres · tests pivots sélectionnés manuellement.'},
      sessionOptions:{...SESSION_OPTIONS,symptoms:[...SESSION_OPTIONS.symptoms,'Irritabilité','Épanchement']},
      guidance:'Statuts interprétés par le clinicien ; aucun seuil automatique. Douleur, irritabilité et épanchement modifient la charge et la décision, sans qualité supplémentaire.' }

  };
  TEMPLATES.LCA=LCA_TEMPLATE;
  function templateFor(c) { return TEMPLATES[c.templateId]; }
  function qualitiesFor(c) { return templateFor(c).qualities; }
  function casesFor(id) { return db.cases.filter(c => c.patientId === id); }

  const app = document.getElementById('app');
  const pageTitle = document.getElementById('pageTitle');
  const backBtn = document.getElementById('backBtn');
  const modal = document.getElementById('modal');
  const modalContent = document.getElementById('modalContent');
  const toast = document.getElementById('toast');

  let route = { name: 'patients', patientId: null, tab: 'overview' };
  let db;
  try { db = loadDB(); }
  catch (error) {
    app.innerHTML = '<div class="notice">Lecture ou migration impossible. Les données locales sont conservées. Exportez une copie du stockage avant toute réparation.</div>';
    document.getElementById('newPatientBtn').disabled = true;
    document.getElementById('settingsBtn').disabled = true;
    return;
  }

  function defaultDB() {
    return { version: CURRENT_VERSION, patients: [], cases: [], updatedAt: nowISO() };
  }

  // Pure migration: keep a full legacy snapshot and move all clinical fields to cases.
  function migrateDB(input) {
    if (!input || !Array.isArray(input.patients)) throw new Error('Patients invalides');
    if (input.version === 4) { validateDB(input); return input; }
    if (input.version === 3) { validateDB(input); return {...input,version:4}; }
    if (input.version === 2) {
      validateDB(input);
      const result = JSON.parse(JSON.stringify(input));
      result.version = 3;
      result.cases.forEach(c => {
        if (c.measurements) {
          c.legacyMeasurements = c.measurements; // archival copy, never read by the clinical engine
          c.measurements.forEach(m => {
            const q = qualitiesFor(c).find(q => q.id === m.qualityId);
            let id = m.id, suffix = 0;
            while (c.pivots.some(p => p.id === id)) id = `migrated_${m.id}_${++suffix}`;
            c.pivots.push({...m,id,originalMeasurementId:m.id,kind:'measurement',test:q?.pivot || 'Mesure historique',result:m.summary || '',decision:m.note || ''});
          });
          delete c.measurements;
          c.pivots.sort((a,b) => String(a.date || '').localeCompare(String(b.date || '')));
        }
      });
      validateDB(result); return migrateDB(result);
    }
    if (input.version != null && input.version !== 1) throw new Error('Version non prise en charge');
    const result = { ...input, version: 2, patients: [], cases: [], legacySnapshot: input };
    input.patients.forEach((old, index) => {
      if (!old || typeof old.name !== 'string') throw new Error('Patient invalide');
      const id = old.id || `legacy_patient_${index}`;
      result.patients.push({ id, name: old.name, createdAt: old.createdAt || nowISO(), updatedAt: old.updatedAt || nowISO(), note: '' });
      const { name, archived, status, lesion, ...clinical } = old;
      result.cases.push({ ...clinical, id: `legacy_case_${index}_${id}`, patientId: id,
        templateId: 'CHEVILLE', title: 'Cheville / pied', side: '', subtype: lesion || 'Latérale',
        context: old.context || '', objective: old.objective || '', targetFunction: old.targetFunction || '', constraints: old.constraints || '',
        status: archived ? 'archived' : 'active', qualityStatus: status || {},
        statusHistory: old.statusHistory || [], sessions: old.sessions || [], pivots: old.pivots || [],
        createdAt: old.createdAt || nowISO(), updatedAt: old.updatedAt || nowISO() });
    });
    validateDB(result);
    return migrateDB(result);
  }

  function validateDB(data) {
    if (!Array.isArray(data.patients) || !Array.isArray(data.cases)) throw new Error('Structure invalide');
    const ids = new Set();
    data.patients.forEach(p => {
      if (!p || typeof p.id !== 'string' || typeof p.name !== 'string' || ids.has(p.id)) throw new Error('Patient invalide');
      ids.add(p.id);
    });
    const caseIds = new Set();
    data.cases.forEach(c => {
      if (!c || typeof c.id !== 'string' || caseIds.has(c.id) || !ids.has(c.patientId) ||
          !TEMPLATES[c.templateId] || !['active','archived'].includes(c.status) ||
          !c.qualityStatus || typeof c.qualityStatus !== 'object' || Array.isArray(c.qualityStatus) ||
          ![c.statusHistory,c.sessions,c.pivots].every(Array.isArray)) throw new Error('Cas invalide');
      if (Object.values(c.qualityStatus).some(value => !['A','B','C','D'].includes(value)) ||
          [...c.statusHistory,...c.sessions,...c.pivots].some(item => !item || typeof item !== 'object') ||
          c.sessions.some(session => session.clinicalValues != null && (typeof session.clinicalValues!=='object' || Array.isArray(session.clinicalValues))) ||
          c.sessions.some(session => ['symptoms','exposure','tolerance','adherence'].some(key => session[key] != null && !Array.isArray(session[key])))) throw new Error('Données longitudinales invalides');
      if (c.measurements != null && (!Array.isArray(c.measurements) || c.measurements.some(m =>
          !m || typeof m.id !== 'string' || typeof m.qualityId !== 'string' || !m.values || typeof m.values !== 'object' ||
          !m.components || typeof m.components !== 'object' || Object.values(m.components).some(part => !part || (part.status != null && !['A','B','C','D'].includes(part.status)))))) throw new Error('Mesures invalides');
      const recordIds = new Set();
      c.pivots.forEach(record => {
        if (typeof record.id !== 'string' || recordIds.has(record.id)) throw new Error('Identifiant pivot invalide');
        recordIds.add(record.id);
        if (record.chosenStatus != null && !['A','B','C','D'].includes(record.chosenStatus)) throw new Error('Décision invalide');
        if (record.values != null && (typeof record.values !== 'object' || Array.isArray(record.values))) throw new Error('Valeurs invalides');
        if (record.components != null && (typeof record.components !== 'object' || Array.isArray(record.components) || Object.values(record.components).some(part => !part || typeof part !== 'object' || (part.status != null && !['A','B','C','D'].includes(part.status))))) throw new Error('Composantes invalides');
      });
      if (c.qualityOverrides != null && (typeof c.qualityOverrides !== 'object' || Array.isArray(c.qualityOverrides))) throw new Error('Statuts manuels invalides');
      if (c.caseData != null && (typeof c.caseData !== 'object' || Array.isArray(c.caseData))) throw new Error('Informations du cas invalides');
      if (c.phase != null && (!Number.isInteger(c.phase) || !TEMPLATES[c.templateId].phases?.some(ph=>ph.id===c.phase))) throw new Error('Phase invalide');
      if (c.phaseHistory != null && (!Array.isArray(c.phaseHistory) || c.phaseHistory.some(h=>!h || !['transition','criterionOverride'].includes(h.type) || typeof h.date!=='string' || (h.type==='transition' && (!TEMPLATES[c.templateId].phases?.some(ph=>ph.id===h.from) || !TEMPLATES[c.templateId].phases?.some(ph=>ph.id===h.to) || !Array.isArray(h.criteria) || h.criteria.some(cr=>!cr || typeof cr.id!=='string' || !['pass','fail','unknown','na'].includes(cr.state) || !['pass','fail','unknown'].includes(cr.rawState))))))) throw new Error('Historique de phase invalide');
      if (c.criterionOverrides != null && (typeof c.criterionOverrides !== 'object' || Array.isArray(c.criterionOverrides) || Object.values(c.criterionOverrides).some(o=>!o || !['pass','fail','unknown','na'].includes(o.state) || typeof o.reason!=='string'))) throw new Error('Override de critère invalide');
      caseIds.add(c.id);
    });
  }

  function retainBackup(raw, reason) {
    const key = `${STORAGE_KEY}_backup_${reason}_${uid('backup')}`;
    localStorage.setItem(key, raw);
  }

  function loadDB() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultDB();
    const parsed = JSON.parse(raw);
    const migrated = migrateDB(parsed);
    if (parsed.version !== CURRENT_VERSION) {
      retainBackup(raw, 'migration');
      localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
    }
    return migrated;
  }

  function saveDB() {
    db.updatedAt = nowISO();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
  }

  function uid(prefix='id') {
    return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
  }

  function nowISO() { return new Date().toISOString(); }
  function fmtDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return new Intl.DateTimeFormat('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric' }).format(d);
  }
  function fmtDateTime(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return new Intl.DateTimeFormat('fr-FR', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' }).format(d);
  }
  function esc(value='') {
    return String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
  }
  function showToast(message) {
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  }
  function getPatient(id) { return db.patients.find(p => p.id === id); }
  function statusLabel(status) { return ({A:'Prioritaire', B:'Déficitaire', C:'Suffisant', D:'Non pertinent / non testable'})[status] || ''; }

  function newPatientObject(data) {
    return { id: uid('pat'), name: data.name.trim(), note: data.note || '', createdAt: nowISO(), updatedAt: nowISO() };
  }

  function newCaseObject(patientId, data) {
    return { ...data, id: uid('case'), patientId, status: 'active', createdAt: nowISO(), updatedAt: nowISO(),
      qualityStatus: Object.fromEntries(TEMPLATES[data.templateId].qualities.map(q => [q.id, 'D'])),
      statusHistory: [], sessions: [], pivots: [], ...(TEMPLATES[data.templateId].phases?{phase:1,phaseHistory:[],criterionOverrides:{}}:{}) };
  }

  function setRoute(name, patientId=null, tab='overview', caseId=null) {
    route = { name, patientId, tab, caseId };
    render();
  }
  function openCase(c) { setRoute('case', c.patientId, 'overview', c.id); window.scrollTo(0,0); }
  function wireCards(holder, selector, action) {
    holder.querySelectorAll(selector).forEach(el => {
      el.addEventListener('click', () => action(el));
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); action(el); } });
    });
  }
  function render() {
    document.querySelectorAll('.nav-btn[data-route]').forEach(b => b.classList.toggle('active', b.dataset.route === route.name));
    backBtn.classList.toggle('hidden', !['patient','case'].includes(route.name));
    if (route.name === 'patients') renderPatients(false);
    else if (route.name === 'archives') renderPatients(true);
    else if (route.name === 'patient') renderPatientProfile();
    else if (route.name === 'case') renderCase();
  }
  function renderPatients(archived) {
    pageTitle.textContent = archived ? 'Tous les patients' : 'Patients actifs';
    const list = db.patients.filter(p => archived || casesFor(p.id).some(c => c.status === 'active'));
    app.innerHTML = `<div class="search"><input id="searchInput" class="input" type="search" placeholder="Rechercher un patient…" /></div>
      <div class="section-head"><div><h2>${archived ? 'Tous les patients · avec ou sans cas' : 'Suivis en cours'}</h2><p>${list.length} patient(s)</p></div></div><div id="patientList" class="stack"></div>`;
    const holder = document.getElementById('patientList');
    const renderList = query => {
      holder.innerHTML = list.filter(p => [p.name,...casesFor(p.id).flatMap(c => [c.title,c.subtype,c.objective,c.targetFunction])].join(' ').toLowerCase().includes(query.toLowerCase())).map(p =>
        `<article class="card patient-card" role="button" tabindex="0" data-patient="${esc(p.id)}"><h3>${esc(p.name)}</h3><div class="meta">${casesFor(p.id).filter(c => c.status === 'active').length} cas actif(s) · ${casesFor(p.id).filter(c => c.status === 'archived').length} cas archivé(s)</div></article>`).join('') || '<div class="empty">Aucun patient.</div>';
      wireCards(holder, '[data-patient]', el => setRoute('patient',el.dataset.patient));
    };
    renderList(''); document.getElementById('searchInput').addEventListener('input',e => renderList(e.target.value));
  }
  function renderPatientProfile() {
    const patient = getPatient(route.patientId);
    if (!patient) return setRoute('patients');
    pageTitle.textContent = patient.name;
    app.innerHTML = `<section class="hero"><h2>${esc(patient.name)}</h2><div>${esc(patient.note || '')}</div><div class="hero-actions"><button id="editIdentityBtn" class="btn">Modifier le patient</button><button id="newCaseBtn" class="btn">+ Nouveau cas</button></div></section>
      ${['active','archived'].map(status => `<div class="section-head"><h2>${status === 'active' ? 'Cas actifs' : 'Cas archivés'}</h2></div><div class="stack">${casesFor(patient.id).filter(c => c.status === status).map(caseCardHTML).join('') || '<div class="empty">Aucun cas.</div>'}</div>`).join('')}`;
    document.getElementById('editIdentityBtn').onclick = () => openPatientModal(patient);
    document.getElementById('newCaseBtn').onclick = () => openCaseModal();
    wireCards(app, '[data-case]', el => openCase(db.cases.find(c => c.id === el.dataset.case)));
  }
  function caseCardHTML(c) {
    return `<article class="card patient-card" role="button" tabindex="0" data-case="${esc(c.id)}"><h3>${esc(c.title)}</h3><div class="meta">${esc(templateFor(c).name)} · ${esc(c.side || 'Côté non renseigné')} · ${esc(c.subtype)}</div><div>${esc(c.objective)}</div><div class="badges">${qualitiesFor(c).map(q => `<span class="badge ${(c.qualityStatus[q.id] || 'D').toLowerCase()}">${esc(q.name)} · ${esc(c.qualityStatus[q.id] || 'D')}</span>`).join('')}</div><div class="meta">${c.sessions.length} séance(s) · ${c.pivots.length} test(s) pivot(s)</div></article>`;
  }

  function renderCase() {
    const p = db.cases.find(c => c.id === route.caseId && c.patientId === route.patientId);
    if (!p) return setRoute('patient', route.patientId);
    const patient = getPatient(p.patientId);
    pageTitle.textContent = patient.name;
    const tabs = [
      ['overview','Synthèse'], ['qualities','Qualités'], ['sessions','Séances'], ['pivots','Tests pivots']
    ];
    app.innerHTML = `
      ${phasePanelHTML(p)}
      <section class="hero">
        <div><div class="meta">${esc(templateFor(p).name)} · ${esc(p.subtype)} · ${esc(p.side || 'Côté non renseigné')}</div><h2>${esc(p.title)}</h2><div>${esc(patient.name)}${p.status === 'archived' ? ' · Cas archivé' : ''}</div></div>
        <div>${esc(p.objective || 'Objectif non renseigné')}</div>
        ${templateFor(p).phases?`<div class="meta">Fonction cible : ${esc(p.targetFunction||'—')}</div>`:''}
        <div class="hero-actions"><button class="btn" id="quickSessionBtn" type="button">+ Séance</button><button class="btn" id="quickPivotBtn" type="button">+ Test pivot</button><button class="btn" id="editPatientBtn" type="button">Modifier</button>${p.status === 'active' ? '<button class="btn case-archive" id="archiveDirectBtn" type="button">Archiver le cas</button>' : ''}</div>
      </section>
      <div class="tabs" style="margin:14px 0">
        ${tabs.map(([id,label]) => `<button class="tab ${route.tab===id?'active':''}" data-tab="${id}" type="button">${label}</button>`).join('')}
      </div>
      <div id="patientTab"></div>`;
    document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { route.tab = b.dataset.tab; renderCase(); }));
    document.getElementById('quickSessionBtn').addEventListener('click', () => openSessionModal(p));
    document.getElementById('quickPivotBtn').addEventListener('click', () => openPivotModal(p));
    document.getElementById('editPatientBtn').addEventListener('click', () => openCaseModal(p));
    const archiveButton = document.getElementById('archiveDirectBtn');
    if (archiveButton) archiveButton.onclick = () => archiveCase(p);
    wirePhasePanel(app,p);
    const tab = document.getElementById('patientTab');
    if (route.tab === 'overview') { renderOverview(tab, p); wireMeasurements(tab, p); }
    if (route.tab === 'qualities') renderQualities(tab, p);
    if (route.tab === 'sessions') renderSessions(tab, p);
    if (route.tab === 'pivots') renderPivots(tab, p);
  }

  function renderOverview(holder, p) {
    const profile = profileFor(p);
    const lastFunction = [...p.pivots].reverse().find(m => m.qualityId === 'function' && !qualitiesFor(p).find(q=>q.id==='function').nonExposureTests?.includes(m.test));
    const change = p.statusHistory.at(-1);
    holder.innerHTML = `<div class="stack">
      ${templateFor(p).phases?'':`<section class="card"><div class="section-head"><h2>${templateFor(p).phases?'Objectif fonctionnel':'Profil : '+esc(p.subtype)}</h2></div>
        ${profile.watch ? `<div class="small">À surveiller : ${esc(profile.watch)}</div>` : ''}
        ${templateFor(p).memos[p.subtype]?`<details><summary class="btn secondary">Repères du profil</summary><div class="notice">${esc(templateFor(p).memos[p.subtype])}</div></details>`:''}
        <div><strong>Fonction cible :</strong> ${esc(p.targetFunction || '—')}</div>
        ${p.context ? `<div class="small">Contexte / diagnostic : ${esc(p.context)}</div>` : ''}
        ${p.constraints ? `<div class="small">Contraintes / notes : ${esc(p.constraints)}</div>` : ''}</section>`}

      <section class="card"><div class="section-head"><h2>Carte clinique</h2><button id="goQualities" class="btn secondary">Ouvrir les qualités</button></div>
        <div class="quality-summary">${qualitiesFor(p).map(q => `<div><span class="badge ${(p.qualityStatus[q.id] || 'D').toLowerCase()}">${esc(q.name)} — ${p.qualityStatus[q.id] || 'D'}</span>${limitingSummary(p,q)}${p.decisionUnresolved?.[q.id] ? '<div class="small">Décision supprimée — statut à réévaluer.</div>' : ''}</div>`).join('')}</div></section>
      ${lastFunction ? `<section class="card"><h2>Dernière exposition fonctionnelle</h2><div>${fmtDate(lastFunction.date)} · ${esc(lastFunction.summary || lastFunction.values?.task || lastFunction.test || '')}</div><div class="small">${esc([lastFunction.values?.duration ? lastFunction.values.duration+' min' : '',lastFunction.values?.distance ? lastFunction.values.distance+' km' : '',lastFunction.values?.reaction,lastFunction.result].filter(Boolean).join(' · '))}</div></section>` : ''}
      ${phaseContextHTML(p)}
      ${change ? `<div class="small">Dernier changement : ${esc(qualitiesFor(p).find(q => q.id === change.qualityId)?.name || change.qualityId)} · ${esc(change.from)} → ${esc(change.to)} · ${fmtDate(change.date)}</div>` : ''}
    </div>`;
    document.getElementById('goQualities').onclick = () => {route.tab='qualities';renderCase();};
  }

  function qualityCardsHTML(p) {
    if(!templateFor(p).phases)return qualitiesFor(p).map(q=>qualityHTML(p,q)).join('');
    const recommended=profileFor(p).qualities||[],primary=qualitiesFor(p).filter(q=>recommended.includes(q.id)||p.pivots.some(m=>m.qualityId===q.id)||(p.profileExtras?.[q.id]||[]).length),secondary=qualitiesFor(p).filter(q=>!primary.includes(q));
    return primary.map(q=>qualityHTML(p,q)).join('')+(secondary.length?`<details><summary class="btn secondary">+ Autres qualités / mesures</summary><div class="stack">${secondary.map(q=>qualityHTML(p,q)).join('')}</div></details>`:'');
  }
  function renderQualities(holder, p) {
    holder.innerHTML = `<div class="section-head"><div><h2>Carte A/B/C/D</h2><p>${esc(templateFor(p).guidance || '')}</p></div></div><div class="stack">${qualityCardsHTML(p)}</div>`;
    wireMeasurements(holder, p);
    holder.querySelectorAll('.status-btn').forEach(btn => btn.addEventListener('click', () => {
      const qid = btn.dataset.quality, next = btn.dataset.status, old = p.qualityStatus[qid] || 'D';
      const q = qualitiesFor(p).find(q => q.id === qid);
      if (q.aggregate) { p.qualityOverrides ||= {}; p.qualityOverrides[qid] = true; }
      if (p.decisionUnresolved) delete p.decisionUnresolved[qid];
      if (old === next) { p.updatedAt = nowISO(); saveDB(); renderCase(); return; }
      p.qualityStatus[qid] = next;
      p.statusHistory.push({ id: uid('st'), qualityId: qid, from: old, to: next, date: nowISO() });
      p.updatedAt = nowISO(); saveDB(); showToast(`${old} → ${next} enregistré`); renderCase();
    }));
  }

  function qualityHTML(p,q) {
    const st = p.qualityStatus[q.id] || 'D';
    const hist = p.statusHistory.filter(h => h.qualityId === q.id).slice(-4);
    const latestPivot = [...p.pivots].reverse().find(x => x.qualityId === q.id);
    return `<section class="card quality-card">
      <div class="quality-head"><div><h3>${esc(q.name)}</h3><div class="meta">Pivot : ${esc(q.pivot)}</div></div><span class="badge ${st.toLowerCase()}">${st} · ${statusLabel(st)}</span></div>

  function openPivotModal(p, existing=null, initialQuality=null, initialTest=null) {

      <button class="btn primary" type="submit">Enregistrer le pivot</button></form>`;
    const form = document.getElementById('pivotForm'), qSelect = form.elements.qualityId, testSelect = form.elements.test;
    const region = document.getElementById('pivotMetrics');
    let q, targets = [], fields = [], proposed = null, referenceUsed = null, source = record, currentKey = null;
    const drafts = new Map();
    function fillQualities(selected) {
      qSelect.innerHTML = qualitiesFor(p).filter(q => showAll || recommendedQualities.includes(q.id) || q.id === selected).map(q => `<option value="${q.id}">${esc(q.name)}</option>`).join('');

      testSelect.innerHTML = list.map(test => `<option>${esc(test)}</option>`).join('');
      if (selected && list.includes(selected)) testSelect.value = selected;
      document.getElementById('otherTestBtn').hidden = all || list.length === q.tests.length;
      if (render) renderMetrics();
    }
    function renderMetrics() {
      if (currentKey) drafts.set(currentKey,readData());
      currentKey = `${q.id}:${testSelect.value}`;
      source = drafts.get(currentKey) || (q.id === record.qualityId ? record : {values:q.defaults?.(p)||{}});
      const ids = q.testTargets?.[testSelect.value] || [];
      // Historical multi-component snapshots remain editable without losing any component.
      targets = (q.components || []).filter(c => ids.includes(c.id) || (existing && q.id === record.qualityId && record.originalMeasurementId && record.components?.[c.id]));
      const fieldIds=q.phaseTestFields?.[p.phase||1]?.[testSelect.value] ?? q.testFields?.[testSelect.value] ?? q.phaseFields?.[p.phase||1];
      fields=fieldIds?(q.fields||[]).filter(f=>fieldIds.includes(f.id) || (existing && hasValues({value:source.values?.[f.id]}))):q.fields||[];
      region.innerHTML = `<div class="form-grid two">${measurementFields(fields,source.values || {},'values')}</div>${targets.map(c => {

        ${c.kind !== 'metric' && targets.length > 1 ? `<label class="label">Statut de la sous-composante<select name="${c.id}.status" class="select">${['D','A','B','C'].map(st => `<option ${data.status === st ? 'selected' : ''}>${st}</option>`).join('')}</select></label>` : ''}</fieldset>`;

    function readData() {

    function updateDerived() {
      const data = readData();
      targets.forEach(c => {const output = region.querySelector(`[data-lsi="${c.id}"]`);if (output) output.textContent = `LSI : ${lsi(data.components[c.id],c.lsiDirection)}`;const normalized=region.querySelector(`[data-normalized="${c.id}"]`);if(normalized)normalized.textContent=normalizedForce(data.components[c.id],data.values);});
      // Only explicitly configured, referenced rules can offer a proposal. No default numeric cutoffs.
      const multiComponent = q.aggregate && targets.length > 1;
      form.elements.chosenStatus.disabled = !!multiComponent;
      document.getElementById('chosenStatusLabel').textContent = multiComponent ? 'Statut global calculé (override possible dans Qualités)' : 'Décision clinique A/B/C/D';
      if (multiComponent) form.elements.chosenStatus.value = aggregateStatus(Object.values(data.components).map(part => part.status));
      const ratioOutput=region.querySelector('[data-rom-ratio]');if(ratioOutput)ratioOutput.textContent=romRatioText(data.values);
      const rule = q.interpretation;
      proposed = rule?.reference && typeof rule.propose === 'function' ? rule.propose(data) : null;
      if (!['A','B','C','D'].includes(proposed)) proposed = null;
      referenceUsed = proposed ? rule.reference : null;
      document.getElementById('interpretationNotice').textContent = proposed ? `Statut proposé : ${proposed} · ${referenceUsed} — modifiable par le clinicien.` : 'Pas de cut-off validé disponible — décision clinique requise.';
    }
    fillQualities(initial); fillTests(record.test || initialTest);
    document.getElementById('otherQualityBtn').onclick = () => {showAll=true;fillQualities(qSelect.value);};
    document.getElementById('otherTestBtn').onclick = () => {const current=testSelect.value;fillTests(current,true,false);};
    qSelect.onchange = () => {form.elements.chosenStatus.value='';fillTests();};
    testSelect.onchange = () => {rememberTest(p,q,testSelect.value);renderMetrics();};
    form.oninput = updateDerived;
    modalContent.querySelector('[data-close]').onclick = closeModal;
    form.onsubmit = e => {
      e.preventDefault();const oldQuality = existing?.qualityId;
      const chosenStatus = form.elements.chosenStatus.value;
      const data = readData();
      const values = {...data,qualityId:q.id,test:testSelect.value,componentIds:targets.map(c => c.id),chosenStatus,proposedStatus:proposed,referenceUsed,
        result:form.elements.result.value.trim(),summary:form.elements.result.value.trim(),decision:form.elements.decision.value.trim(),
        side:form.elements.side.value,question:form.elements.question.value.trim(),sessionNumber:form.elements.sessionNumber.value ? Number(form.elements.sessionNumber.value) : null};
      if (existing) Object.assign(existing,values,{updatedAt:nowISO()});
      else p.pivots.push({id:uid('piv'),date:nowISO(),...values});
      // A fresh clinical decision supersedes the previous manual global override.
      if (q.aggregate && p.qualityOverrides) delete p.qualityOverrides[q.id];
      rememberTest(p,q,testSelect.value,false);
      if (oldQuality && oldQuality !== q.id) refreshAutomaticStatus(p,qualitiesFor(p).find(q => q.id === oldQuality));
      refreshAutomaticStatus(p,q);p.updatedAt=nowISO();saveDB();closeModal();route.tab='pivots';renderCase();
    };
    openModal();
  }

  function openSettings() {
    const stats = {active:db.cases.filter(c=>c.status === 'active').length, archived:db.cases.filter(c=>c.status === 'archived').length, sessions:db.cases.reduce((s,c)=>s+c.sessions.length,0)};
    modalContent.innerHTML = `<div class="modal-inner">
      <div class="modal-head"><div><div class="eyebrow" style="color:var(--muted)">Données locales</div><h2>Sauvegarde & confidentialité</h2></div><button class="close-btn" type="button" data-close>×</button></div>
      <div class="kpi-row"><div class="kpi"><strong>${stats.active}</strong><span>cas actifs</span></div><div class="kpi"><strong>${stats.archived}</strong><span>cas archivés</span></div><div class="kpi"><strong>${stats.sessions}</strong><span>séances</span></div></div>
      <div class="notice"><strong>Cette V1 ne transmet rien à un serveur.</strong> Les données sont conservées dans le stockage du navigateur de cet appareil. Elles ne sont pas chiffrées par l’application : utilise idéalement des identifiants/pseudonymes et protège l’iPad par code/Face ID.</div>
      <div class="btn-row"><button id="exportBtn" class="btn primary" type="button">Exporter la sauvegarde JSON</button><label class="btn secondary" style="display:inline-flex;align-items:center;cursor:pointer">Restaurer une sauvegarde<input id="importInput" type="file" accept="application/json,.json" hidden /></label></div>
      <div class="small">Dernière modification : ${fmtDateTime(db.updatedAt)}</div>
    </div>`;
    openModal(); modalContent.querySelector('[data-close]').addEventListener('click',closeModal);
    document.getElementById('exportBtn').addEventListener('click', exportBackup);
    document.getElementById('importInput').addEventListener('change', importBackup);
  }

  function exportBackup() {
    const payload = JSON.stringify(db, null, 2);
    const blob = new Blob([payload], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=`cockpit-clinique-backup-${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); showToast('Sauvegarde exportée');
  }
  function importBackup(e) {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    const reader = new FileReader(); reader.onload = () => {
      try { const restored=migrateDB(JSON.parse(reader.result)); if (!confirm('Remplacer les données actuelles par cette sauvegarde ? Une copie locale des données actuelles sera conservée.')) return; retainBackup(JSON.stringify(db), 'import'); localStorage.setItem(STORAGE_KEY, JSON.stringify(restored)); db=restored; closeModal(); showToast('Sauvegarde restaurée'); setRoute('patients'); }
      catch { showToast('Fichier de sauvegarde invalide'); }
    }; reader.readAsText(file);
  }

  function openModal() { if (typeof modal.showModal === 'function') modal.showModal(); else modal.setAttribute('open',''); }
  function closeModal() { if (typeof modal.close === 'function') modal.close(); else modal.removeAttribute('open'); }

  document.querySelectorAll('.nav-btn[data-route]').forEach(b => b.addEventListener('click', () => setRoute(b.dataset.route)));
  document.getElementById('newPatientBtn').addEventListener('click', () => openPatientModal());
  document.getElementById('settingsBtn').addEventListener('click', openSettings);
  backBtn.addEventListener('click', () => route.name === 'case' ? setRoute('patient',route.patientId) : setRoute('patients'));
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }

  render();
})();

  </script>
</body>
</html>
